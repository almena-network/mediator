# https://taskfile.dev
version: "3"

dotenv: [".env"]

vars:
  IMAGE: almena-node:dev

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  init:
    desc: Create .env from .env.example (an existing .env is left untouched)
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  redis:
    desc: Start Redis in Docker (for task dev), reachable on 127.0.0.1
    cmds:
      - docker compose up --detach --wait redis

  dev:
    desc: Run the node locally with readable debug logs (starts Redis in Docker)
    deps: [redis]
    env:
      ALMENA_LOG_FORMAT: pretty
      ALMENA_REDIS_URL: redis://127.0.0.1:{{.ALMENA_REDIS_PORT | default "6379"}}
      RUST_LOG: '{{.RUST_LOG | default "almena_node=debug,tower_http=debug,info"}}'
    cmds:
      - cargo run

  dev:memory:
    desc: Run the node locally without Docker, storing everything in memory (lost on restart)
    env:
      ALMENA_LOG_FORMAT: pretty
      ALMENA_REDIS_URL: memory://
      RUST_LOG: '{{.RUST_LOG | default "almena_node=debug,tower_http=debug,info"}}'
    cmds:
      - cargo run

  smoke:
    desc: "End-to-end check of a running node: mediation, a forwarded message, pickup (URL: task smoke -- http://host:port)"
    cmds:
      - cargo run --quiet -p almena-node --example smoke -- {{.CLI_ARGS | default (printf "http://localhost:%s" (.ALMENA_NODE_PORT | default "8080"))}}

  build:
    desc: Build the release binary (target/release/almena-node)
    cmds:
      - cargo build --release --locked

  test:
    desc: Run the test suite
    cmds:
      - cargo test --locked {{.CLI_ARGS}}

  test:redis:
    desc: Run the test suite including the Redis store tests (starts Redis in Docker)
    deps: [redis]
    env:
      ALMENA_TEST_REDIS_URL: redis://127.0.0.1:{{.ALMENA_REDIS_PORT | default "6379"}}
    cmds:
      - cargo test --locked {{.CLI_ARGS}}

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt

  lint:
    desc: Check formatting and run clippy with warnings as errors
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets --locked -- -D warnings

  check:
    desc: Everything that must pass before finishing a change (lint + test)
    cmds:
      - task: lint
      - task: test

  clean:
    desc: Remove build output and the local Docker image
    cmds:
      - cargo clean
      - docker image rm -f {{.IMAGE}}

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the node in Docker (detached) and wait until it is healthy
    cmds:
      - docker compose up --build --detach --wait

  down:
    desc: Stop and remove the Docker containers
    cmds:
      - docker compose down

  logs:
    desc: Follow the node's container logs
    cmds:
      - docker compose logs --follow node

  did:
    desc: Show the running node's DID document
    cmds:
      - curl --fail --silent --show-error http://localhost:{{.ALMENA_NODE_PORT | default "8080"}}/.well-known/did.json
      - echo
    silent: true

  health:
    desc: Query the running node's health endpoint
    cmds:
      - curl --fail --silent --show-error http://localhost:{{.ALMENA_NODE_PORT | default "8080"}}/health
      - echo
    silent: true
